<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="network-auth.css"><title>TeamPass HTTP-Anmeldung</title></head><body><header><img src="icons/icon48.png" alt=""><div><h1><span data-i18n="httpLogin">HTTP Basic authentication</span></h1><p id="target"></p></div></header><section class="info"><b data-i18n="website">Website</b><span id="url"></span><b data-i18n="realm">Realm</b><span id="realm"></span></section><main><section id="unlockSection" class="manual" hidden><h2><span data-i18n="vaultLocked">TeamPass is locked</span></h2><p data-i18n="enterMaster">Enter the local master passphrase to continue.</p><label><span data-i18n="masterPassphraseLabel">Local master passphrase</span><input id="masterPassphrase" type="password" autocomplete="current-password"></label><button id="unlock" data-i18n="unlock">Unlock</button></section><section id="matches"><h2><span data-i18n="selectEntry">Select TeamPass entry</span></h2><div id="entries"></div></section><section class="manual"><h2><span data-i18n="enterCredentials">Enter credentials</span></h2><p>Die Eingabe erfolgt in diesem TeamPass-Fenster, damit die Zugangsdaten nach erfolgreicher Anmeldung zum Speichern vorgemerkt werden können.</p><label><span data-i18n="username">Username</span><input id="login" autocomplete="username"></label><label><span data-i18n="password">Password</span><input id="password" type="password" autocomplete="current-password"></label><button id="manualLogin" data-i18n="loginRemember">Sign in and remember for saving</button></section><p id="status"></p></main><footer><button id="suppress" data-i18n="suppressSession">Do not ask again this session</button><button id="cancel" data-i18n="cancel30">Cancel (30 seconds)</button></footer><script src="i18n.js"></script><script src="network-auth.js"></script></body></html>
